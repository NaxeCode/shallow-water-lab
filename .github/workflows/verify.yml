name: Verify flume
on: [push, pull_request]
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/run.mjs --cells 960 --time 4
